<style>
html,body{margin:0;height:100%;background:#1c0409;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#stage{position:absolute;left:50%;top:50%;width:390px;height:844px;overflow:hidden;box-sizing:border-box;transform-origin:center center;visibility:hidden;
background:radial-gradient(120% 70% at 50% 38%,#7d1626 0%,#5a0c1b 45%,#35050e 100%);color:#f6ecd8;font-family:'Jost',system-ui,sans-serif}
#stage.pronto{visibility:visible}
button{font-family:inherit}
.abs{position:absolute}
.cena{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(14px);pointer-events:none;
transition:opacity 350ms ease 0ms,transform 350ms ease 0ms,visibility 0s linear 350ms}
.cena.on{opacity:1;visibility:visible;transform:translateY(0px);
transition:opacity 700ms ease 550ms,transform 700ms ease 550ms,visibility 0s linear 0s}
#capa{transform:scale(1.06);transition:opacity 600ms ease 250ms,transform 700ms ease 250ms,visibility 0s linear 850ms}
#capa.on{transform:scale(1);transition:opacity 600ms ease 150ms,transform 600ms ease 150ms,visibility 0s linear 0s}
.camada{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1600ms ease 150ms}
.canto{position:absolute;width:8px;height:8px;transform:rotate(45deg)}
.estrela{animation-name:cintila;animation-iteration-count:infinite;animation-timing-function:ease-in-out;position:absolute}
@keyframes cintila{0%,100%{opacity:0.12;transform:scale(0.55)}50%{opacity:1;transform:scale(1)}}
@keyframes cai{0%{transform:translateY(0px) rotate(0deg);opacity:0}15%{opacity:0.9}100%{transform:translateY(420px) rotate(140deg);opacity:0}}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.cai{animation-name:cai;animation-iteration-count:infinite;animation-timing-function:linear;position:absolute}
.btn-ouro{display:flex;align-items:center;justify-content:center;width:260px;height:54px;box-sizing:border-box;border:0;cursor:pointer;background:#d9b66f;color:#35050e;font-weight:500;font-size:15px;text-transform:uppercase;border-radius:2px;outline:1px solid rgba(217,182,111,0.6);outline-offset:4px}
.rotulo{font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:#d9b66f;font-weight:500}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.opcao{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;box-sizing:border-box;padding:8px 18px 8px 14px;border-radius:999px;cursor:pointer;text-align:left;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.1}
.opcao .letra{flex:none;width:32px;height:32px;box-sizing:border-box;border:1.5px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Jost',system-ui,sans-serif;font-weight:500;font-size:14px}
.opcao .texto{flex:1}
.opcao svg{flex:none;display:none}
input:focus{outline:2px solid #f6ecd8;outline-offset:6px}
input::placeholder{color:rgba(246,236,216,0.5)}
button:focus-visible{outline:2px solid #f6ecd8;outline-offset:4px}
#rajada{position:absolute;inset:0;pointer-events:none;overflow:hidden}
@media (prefers-reduced-motion: reduce){
.cena,.cena.on,#capa,#capa.on{transition:none !important}
#rajada{display:none}
.estrela{animation:none !important;opacity:0.55}
.cai{display:none}
.tempo{animation:none !important}
}
</style>
</head>
<body>
<noscript><p style="color:#f6ecd8;font-family:sans-serif;padding:24px">Para jogar o Grand Quiz Jeté, ative o JavaScript no navegador.</p></noscript>

<!-- NOME -->

<div class="abs" style="inset:22px;display:flex;flex-direction:column;align-items:stretch;padding:26px 28px 40px;box-sizing:border-box">

</div>

<div style="display:flex;flex-direction:column;flex:1;margin:0">

<!-- PERGUNTA -->

<span style="color:#f6ecd8">Grand</span><span style="color:#d9b66f">QUIZ</span><span style="color:#f6ecd8">Jeté</span>
</div>
</div>
</div>
<div style="margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px">

<svg class="cai" viewBox="0 0 24 24" style="left:320px;top:30px;width:13px;height:13px;color:#e8c77d;animation-duration:8s;animation-delay:-6s;filter:drop-shadow(0 0 4px rgba(232,199,125,0.8))"><path fill="currentColor" d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0 Z"/></svg>

  cena('perg', pergOn, phase === 'perg' && S.pronta);
  cena('feliz', felizOn, phase === 'feliz');
  cena('triste', tristeOn, phase === 'triste');

  /* tela do nome */
  var inp = $('inNome');
  if (inp.value !== nome) inp.value = nome;
  inp.style.fontSize = (nome.length > 20 ? 20 : (nome.length > 14 ? 26 : 32)) + 'px';
  $('btnEnviar').style.display = preenchido ? 'flex' : 'none';
  $('btnEnviarOff').style.display = preenchido ? 'none' : 'flex';
  Array.prototype.forEach.call(document.querySelectorAll('.nomeJog'), function (e) { e.textContent = nome; });

  /* fundo por nível */
  var nv = nivelAtual();
  var temaOn = phase === 'voar2' || phase === 'perg' || phase === 'armar3' || phase === 'voar3' || phase === 'feliz' || phase === 'triste';
  Array.prototype.forEach.call(document.querySelectorAll('.camada'), function (c) {
    c.style.opacity = (temaOn && c.getAttribute('data-k') === nv) ? '1' : '0';
  });

  /* pergunta */
  var qa = atual() || { nivel: 'D', q: '', o: ['', '', '', ''], c: 0 };
  var textos = qa.o, certa = qa.c, idx = S.idx;
  var escolha = S.escolha;
  var respondeu = escolha !== -1 && S.pronta;
  var maxOp = Math.max.apply(null, textos.map(function (t) { return t.length; }));
  var opFonte = maxOp > 70 ? 15 : (maxOp > 50 ? 17 : (maxOp > 35 ? 19 : (maxOp > 22 ? 21 : 23)));
  var ql = qa.q.length;
  var pFonte = ql > 115 ? 20 : (ql > 90 ? 22 : (ql > 65 ? 24 : 27));
  var premioTxt = fmt(PREMIOS[idx] || PREMIOS[0]);
  var premioFonte = premioTxt.length <= 3 ? 76 : (premioTxt.length <= 5 ? 70 : (premioTxt.length <= 6 ? 58 : (premioTxt.length <= 7 ? 50 : 40)));
  var pg = $('pergunta'); pg.textContent = qa.q; pg.style.fontSize = pFonte + 'px';
  var pr = $('premio'); pr.textContent = premioTxt; pr.style.fontSize = premioFonte + 'px'; pr.setAttribute('aria-label', 'Valendo ' + premioTxt + ' pontos');
  $('ladder').setAttribute('aria-label', 'Pergunta ' + (idx + 1) + ' de 13');
  Array.prototype.forEach.call($('ladder').children, function (d, i) {
    var marco = MARCOS.indexOf(i) >= 0 || i === 12, feita = i < idx, atualP = i === idx, sz = marco ? 11 : 8;
    d.style.width = sz + 'px'; d.style.height = sz + 'px';
    d.style.borderRadius = marco ? '1px' : '50%';
    d.style.transform = marco ? 'rotate(45deg)' : 'rotate(0deg)';
    d.style.background = atualP ? '#f6ecd8' : (feita ? '#d9b66f' : 'transparent');
    d.style.border = '1px solid ' + (atualP ? '#f6ecd8' : (feita ? '#d9b66f' : 'rgba(217,182,111,0.55)'));
    d.style.boxShadow = atualP ? '0 0 8px 2px rgba(246,236,216,0.85)' : 'none';
  });
  Array.prototype.forEach.call($('opcoes').children, function (b, i) {
    var bg = 'rgba(53,5,14,0.55)', bd = 'rgba(217,182,111,0.75)', fg = '#f6ecd8', op = 1, ehCerta = false, ehErrada = false;
    if (respondeu) {
      if (i === certa) { bg = '#d9b66f'; bd = '#d9b66f'; fg = '#35050e'; ehCerta = true; }
      else if (i === escolha) { bg = 'rgba(20,2,6,0.85)'; bd = '#f6ecd8'; ehErrada = true; }
      else { op = 0.45; }
    }
    b.style.background = bg; b.style.border = '1px solid ' + bd; b.style.color = fg; b.style.opacity = op;
    b.style.fontSize = opFonte + 'px'; b.disabled = respondeu;
    b.querySelector('.texto').textContent = textos[i];
    b.querySelector('.ok').style.display = ehCerta ? 'block' : 'none';
    b.querySelector('.no').style.display = ehErrada ? 'block' : 'none';
  });
  var restante = S.restante, total = NIVEIS[nv].tempo;
  var pulsa = !(escolha !== -1) && S.pronta && restante <= 3;
  var barraCor = restante <= 3 ? '#f6ecd8' : '#d9b66f';
  var bar = $('barra'); bar.setAttribute('aria-valuemax', total); bar.setAttribute('aria-valuenow', restante);
  var bf = $('barraFill'); bf.style.width = (restante / total * 100) + '%'; bf.style.background = barraCor; bf.style.boxShadow = pulsa ? '0 0 8px rgba(246,236,216,0.9)' : 'none';
  var tp = $('tempo'); tp.textContent = restante; tp.style.color = barraCor; tp.style.animationName = pulsa ? 'pulsa' : 'none';
  $('resultado').textContent = !respondeu ? '' : (S.esgotado ? 'Acabou o tempo!' : (escolha === certa ? 'Resposta certa!' : 'Quase!'));

  /* acertou / errou */
  var sn = S.snap || { idx: idx, certa: textos[certa] };
  var venceu = sn.idx === SEQ.length - 1;
  var certaTxt = sn.certa || '';
  var certaFonte = certaTxt.length > 60 ? 18 : (certaTxt.length > 35 ? 22 : (certaTxt.length > 20 ? 26 : 30));
  $('felizTitulo').textContent = venceu ? 'Campeão!' : 'Acertou!';
  $('felizFrase').textContent = venceu ? 'Um milhão de aplausos, ' : 'Parabéns, ';
  $('btnProxima').textContent = venceu ? 'Jogar de novo' : 'Próxima pergunta';
  var cf = $('certaFeliz'); cf.textContent = certaTxt; cf.style.fontSize = certaFonte + 'px';
  var ct = $('certaTriste'); ct.textContent = certaTxt; ct.style.fontSize = certaFonte + 'px';
  var leva = levaPara(sn.idx);
  $('levaTexto').textContent = leva === 0 ? 'Nenhum ponto, ainda' : (fmt(leva) + ' pontos');
  $('tristeTitulo').textContent = S.esgotado ? 'O tempo acabou' : 'Não foi dessa vez';
  $('tristeTexto').textContent = S.esgotado ? ', até no palco o tempo passa depressa.' : ', até os grandes bailarinos perdem um passo.';
}

/* ---------- ajuste à tela do celular ---------- */
function ajustar() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth, h = vv ? vv.height : window.innerHeight;
  var s = Math.min(w / 390, h / 844);
  $('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}

montar();
render();
ajustar();
$('stage').className = 'pronto';
window.addEventListener('resize', ajustar);
if (window.visualViewport) window.visualViewport.addEventListener('resize', ajustar);
window.addEventListener('orientationchange', ajustar);
})();
</script>
</body>
